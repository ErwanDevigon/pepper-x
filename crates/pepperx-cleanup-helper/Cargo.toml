[package]
name = "pepperx-cleanup-helper"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "pepperx-cleanup-helper"
path = "src/main.rs"

[dependencies]
pepperx-platform = { path = "../pepperx-platform" }
# GPU backends for llama.cpp:
#   cuda — NVIDIA GPUs (requires CUDA toolkit)
# Vulkan is disabled: build needs `glslc` (shaderc / Vulkan SDK).
# To re-enable for AMD/Intel GPUs, install glslc then add "vulkan" to both
# llama-cpp-4 and llama-cpp-sys-4 features below.
llama-cpp-4 = { version = "0.3.2", default-features = false, features = ["native", "cuda"] }
llama-cpp-sys-4 = { version = "0.3.2", default-features = false, features = ["native", "cuda"] }
num_cpus = "1.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
llama-cpp-4 = { version = "0.3.2", default-features = false, features = ["native", "cuda"] }
